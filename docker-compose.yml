services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - testdesk-db:/data/db

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/testdesk
      JWT_SECRET: testdesk-docker-demo-secret
      JWT_EXPIRES_IN: 8h
      ADMIN_EMAIL: admin@testdesk.dev
      ADMIN_PASSWORD: Admin@12345

volumes:
  testdesk-db:
